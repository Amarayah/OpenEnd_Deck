<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lesson Board">
<meta name="theme-color" content="#141922">
<title>Lesson Board</title>
<style>
/* Layout: studio chrome around a letterboxed 16:9 board. Tools left, ink + record dock bottom. */
:root{
  --chrome:#141922;      /* app frame */
  --panel:#1d2430;       /* bars and sheets */
  --panel-2:#262f3e;     /* raised controls */
  --line:#344155;        /* hairlines */
  --text:#e8ecf3;
  --muted:#97a3b8;
  --accent:#f4c655;      /* chalk yellow: active tool, focus */
  --accent-ink:#1b1606;
  --rec:#ff4b4b;         /* recording only */
  --ok:#4ade80;
  --radius:10px;
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--chrome);color:var(--text);font:14px/1.4 var(--ui);
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;touch-action:manipulation}
[hidden]{display:none!important}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
 
/* top bar */
#top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
#top.recording{box-shadow:inset 0 -3px 0 var(--rec)}
#boardName{min-width:0;flex:0 1 260px;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px;font-weight:650;font-size:15px}
#boardName:hover,#boardName:focus{border-color:var(--line);outline:none;background:var(--chrome)}
#saveState{color:var(--muted);font-size:12px;white-space:nowrap}
#saveState.warn{color:var(--accent)}
.spacer{flex:1}
.grp{display:flex;align-items:center;gap:2px;background:var(--chrome);border:1px solid var(--line);border-radius:var(--radius);padding:2px}
#pageLabel{min-width:52px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
 
.ib{display:inline-grid;place-items:center;width:40px;height:40px;border:0;border-radius:8px;background:transparent;cursor:pointer}
.ib:hover{background:var(--panel-2)}
.ib:disabled{opacity:.35;cursor:default;background:transparent}
.ib svg,.btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel-2);cursor:pointer;white-space:nowrap;font-weight:550}
.btn:hover{border-color:#4a5a73}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:#ffb4b4}
.btn.armed{background:#5a1d1d;border-color:var(--rec);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:18px;height:18px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
 
/* main */
#main{display:flex;min-height:0}
#tools{display:flex;flex-direction:column;gap:4px;padding:10px 8px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
#tools .ib{width:46px;height:46px}
#tools .ib[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#tools hr{width:100%;border:0;border-top:1px solid var(--line);margin:4px 0}
#stage{position:relative;flex:1;min-width:0;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 40%, #1b2230, var(--chrome) 70%)}
#view{display:block;touch-action:none;border-radius:4px;box-shadow:0 1px 0 #ffffff12, 0 18px 50px #00000080;background:#fff;cursor:crosshair}
#textEditor{position:absolute;z-index:5;min-width:160px;min-height:1.4em;padding:0 4px;margin:0;resize:none;overflow:hidden;white-space:pre;
  background:rgba(255,255,255,.55);border:2px dashed var(--accent);border-radius:4px;outline:none;line-height:1.25;
  font-weight:600;font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif}
#textDone{position:absolute;z-index:6}
#codeBar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 10px 30px #0009;width:max-content;max-width:calc(100% - 20px)}
#codeBar .btn{height:36px;padding:0 10px}
#codeBar .ib{width:36px;height:36px}
#cbState{padding:0 4px;white-space:nowrap}
#codeSelBox{position:absolute;z-index:4;border:2px dashed var(--accent);border-radius:12px;pointer-events:none}
.codearea{width:100%;min-height:240px;max-height:44vh;resize:vertical;border-radius:10px;border:1px solid var(--line);background:#0f1218;color:#e4e8f0;
  font:14px/1.5 var(--mono);padding:12px;white-space:pre;overflow:auto;tab-size:4;outline:none}
.codearea:focus{border-color:var(--accent)}
#countdown{position:absolute;inset:0;display:grid;place-items:center;font:800 160px/1 var(--ui);color:#fff;
  text-shadow:0 6px 40px #000;background:#0006;z-index:8;font-variant-numeric:tabular-nums}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:999px;
  font-size:13px;z-index:7;pointer-events:none;max-width:90%;text-align:center}
#banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:7;background:#3b2f0e;border:1px solid var(--accent);color:#fde7a8;
  padding:8px 14px;border-radius:var(--radius);font-size:13px;max-width:92%}
 
/* bottom bar */
#props{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line)}
.swatches{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
#customColor{width:34px;height:34px;border:0;padding:0;background:none;border-radius:50%;cursor:pointer}
.sizewrap{display:flex;align-items:center;gap:8px}
.sizewrap label{color:var(--muted);font-size:12px}
#size{width:130px;accent-color:var(--accent)}
#sizeDot{width:34px;height:34px;display:grid;place-items:center}
#sizeDot i{display:block;border-radius:50%;background:var(--text)}
.switch{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
 
#recDock{display:flex;align-items:center;gap:6px;margin-left:auto;background:var(--chrome);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 4px}
#btnRec{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;border:0;background:var(--rec);color:#fff;font-weight:700;cursor:pointer}
#btnRec i{width:12px;height:12px;border-radius:50%;background:#fff}
#btnRec.live{background:#3a1c1c;box-shadow:inset 0 0 0 2px var(--rec)}
#btnRec.live i{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){#btnRec.live i{animation:none}}
#recTime{font:600 15px var(--mono);min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
#meter{width:6px;height:28px;border-radius:3px;background:var(--panel-2);position:relative;overflow:hidden}
#meter b{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--ok)}
#btnMic[aria-pressed="false"]{color:var(--muted)}
 
/* sheets */
.backdrop{position:fixed;inset:0;z-index:50;background:#05070bb3;display:grid;place-items:center;padding:16px}
.sheet{width:min(560px,100%);max-height:min(86vh,900px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px #000a}
.sheet.wide{width:min(760px,100%)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px 20px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:17px;font-weight:700;text-wrap:balance}
.sheet-body{padding:16px 20px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.sheet h3{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:650}
.sheet p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.badge.rec{color:#fff;background:#5a1d1d;border-color:var(--rec)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;color:var(--muted)}
select,.input{height:40px;border-radius:var(--radius);border:1px solid var(--line);background:var(--chrome);padding:0 10px;min-width:0}
video{width:100%;border-radius:10px;background:#000;max-height:46vh}
.progress{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.progress b{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.bgopts{display:flex;gap:10px;flex-wrap:wrap}
.bgopt{width:72px;height:44px;border-radius:8px;border:2px solid var(--line);cursor:pointer;padding:0}
.bgopt[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--chrome);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
 
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:#0b0e14f2;
  border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:12px;max-width:min(520px,92vw);box-shadow:0 10px 30px #0008}
 
@media (max-width:1300px){
  .wide-only{display:none}
  .sizewrap label{display:none}
  #size{width:100px}
  .sw{width:28px;height:28px}
  #props{gap:8px 10px}
}
@media (max-width:820px){
  #boardName{flex-basis:140px}
  #saveState,.wide-only{display:none}
  #size{width:96px}
}
@media (max-width:560px){
  #main{flex-direction:column-reverse}
  #tools{flex-direction:row;border-right:0;border-top:1px solid var(--line);overflow-x:auto;padding:6px}
  #tools hr{width:auto;height:30px;border-top:0;border-left:1px solid var(--line);margin:0 4px}
  #recDock{margin-left:0}
}
.btn.armed .wide-only{display:inline!important}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="ib" id="btnBoards" aria-label="Boards" title="Boards" data-icon="boards"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect></svg></button>
    <input id="boardName" aria-label="Board name" maxlength="80" spellcheck="false" autocomplete="off">
    <span id="saveState">Saved</span>
    <div class="spacer"></div>
    <div class="grp">
      <button class="ib" id="btnUndo" aria-label="Undo" title="Undo (⌘Z)" data-icon="undo" disabled=""><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg></button>
      <button class="ib" id="btnRedo" aria-label="Redo" title="Redo (⇧⌘Z)" data-icon="redo" disabled=""><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"></path><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"></path></svg></button>
    </div>
    <div class="grp">
      <button class="ib" id="btnPrev" aria-label="Previous page" title="Previous page" data-icon="left" disabled=""><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
      <span id="pageLabel" aria-live="polite">1 / 1</span>
      <button class="ib" id="btnNext" aria-label="Next page" title="Next page" data-icon="right" disabled=""><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
      <button class="ib" id="btnPages" aria-label="Pages" title="Add, duplicate or delete pages" data-icon="pages"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="3" width="13" height="16" rx="2"></rect><path d="M4 7v12a2 2 0 0 0 2 2h9"></path><path d="M12.5 8v6M9.5 11h6"></path></svg></button>
    </div>
    <button class="ib" id="btnTakes" aria-label="Recordings" title="Recordings" data-icon="film"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M7 5v14M17 5v14M3 9.5h4M3 14.5h4M17 9.5h4M17 14.5h4"></path></svg></button>
    <button class="ib" id="btnExport" aria-label="Save and export" title="Save and export the board" data-icon="share"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="m8 7 4-4 4 4"></path><path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"></path></svg></button>
    <button class="ib" id="btnSettings" aria-label="Settings" title="Settings" data-icon="sliders"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg></button>
  </header>
 
  <div id="main">
    <nav id="tools" aria-label="Tools">
      <button class="ib" data-tool="move" aria-label="Move" title="Move (V)" data-icon="move" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18"></path><path d="m9 6 3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"></path></svg></button>
      <button class="ib" data-tool="pen" aria-label="Pen" title="Pen (P)" data-icon="pen" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"></path><path d="m14.5 6.5 3 3"></path></svg></button>
      <button class="ib" data-tool="hl" aria-label="Highlighter" title="Highlighter (H)" data-icon="hl" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4 5 5-7.5 7.5H8v-4.5z"></path><path d="M8 12l-4 4v4h4l2-2"></path><path d="M14 20h6"></path></svg></button>
      <button class="ib" data-tool="eraser" aria-label="Eraser" title="Eraser (E)" data-icon="eraser" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 14.5 13 6a2 2 0 0 1 2.8 0l3.2 3.2a2 2 0 0 1 0 2.8L12 19H8.5z"></path><path d="M14 19h6M9 10l5 5"></path></svg></button>
      <hr>
      <button class="ib" data-tool="line" aria-label="Line" title="Line (L)" data-icon="line" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5"></path></svg></button>
      <button class="ib" data-tool="arrow" aria-label="Arrow" title="Arrow (A)" data-icon="arrow" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5"></path><path d="M10 5h9v9"></path></svg></button>
      <button class="ib" data-tool="rect" aria-label="Rectangle" title="Rectangle (R)" data-icon="rect" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1.5"></rect></svg></button>
      <button class="ib" data-tool="ellipse" aria-label="Ellipse" title="Ellipse (O)" data-icon="ellipse" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="7"></ellipse></svg></button>
      <button class="ib" data-tool="text" aria-label="Text" title="Text (T)" data-icon="text" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7V5h14v2M12 5v14M9 19h6"></path></svg></button>
      <button class="ib" data-tool="code" aria-label="Code block" title="Code block (C)" data-icon="code" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"></path></svg></button>
      <hr>
      <button class="ib" id="btnImage" aria-label="Insert image" title="Insert image" data-icon="image"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="m21 16-5-5-8 8"></path></svg></button>
      <button class="ib" data-tool="laser" aria-label="Laser pointer" title="Laser pointer (K)" data-icon="laser" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="currentColor"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg></button>
    </nav>
    <div id="stage">
      <canvas id="view" aria-label="Whiteboard" width="2119" height="1192" style="cursor: crosshair; width: 1060px; height: 596px;"></canvas>
      <textarea id="textEditor" hidden="" rows="1" aria-label="Type text"></textarea>
      <button class="btn primary" id="textDone" hidden="">Done</button>
      <div id="codeSelBox" hidden=""></div>
      <div id="codeBar" hidden="" role="toolbar" aria-label="Code block controls">
        <button class="btn primary" id="cbNext" title="Type the next part (Space)"><svg data-i="play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"></path></svg>Type next</button>
        <button class="btn" id="cbAll">Show all</button>
        <button class="btn" id="cbHide">Hide</button>
        <button class="btn" id="cbSpot" title="Remove the line highlight">Clear spotlight</button>
        <button class="ib" id="cbUp" aria-label="Scroll up" title="Scroll up" data-icon="up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"></path></svg></button>
        <button class="ib" id="cbDown" aria-label="Scroll down" title="Scroll down" data-icon="down"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
        <span id="cbState" class="muted small"></span>
        <button class="btn" id="cbEdit">Edit</button>
        <button class="btn danger" id="cbDel"><svg data-i="trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6"></path><path d="m6 7 1 13h10l1-13"></path><path d="M9 7V4h6v3"></path></svg>Delete</button>
        <button class="ib" id="cbDone" aria-label="Close code controls" title="Done" data-icon="x"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>
      <div id="countdown" hidden=""></div>
      <div id="banner" hidden=""></div>
      <div id="hint" hidden=""></div>
    </div>
  </div>
 
  <footer id="props">
    <div class="swatches" id="swatches" role="group" aria-label="Ink colour"><button class="sw" data-c="#111827" style="background:#111827" aria-label="Colour #111827" aria-pressed="true"></button><button class="sw" data-c="#ffffff" style="background:#ffffff" aria-label="Colour #ffffff" aria-pressed="false"></button><button class="sw" data-c="#e11d48" style="background:#e11d48" aria-label="Colour #e11d48" aria-pressed="false"></button><button class="sw" data-c="#f97316" style="background:#f97316" aria-label="Colour #f97316" aria-pressed="false"></button><button class="sw" data-c="#eab308" style="background:#eab308" aria-label="Colour #eab308" aria-pressed="false"></button><button class="sw" data-c="#16a34a" style="background:#16a34a" aria-label="Colour #16a34a" aria-pressed="false"></button><button class="sw" data-c="#2563eb" style="background:#2563eb" aria-label="Colour #2563eb" aria-pressed="false"></button><button class="sw" data-c="#7c3aed" style="background:#7c3aed" aria-label="Colour #7c3aed" aria-pressed="false"></button></div>
    <input type="color" id="customColor" aria-label="Custom colour" title="Custom colour">
    <div class="sizewrap" id="sizeWrap" style="visibility: visible;">
      <label for="size">Size</label>
      <input type="range" id="size" min="1" max="40" step="1">

  let cancel = false;

  body.append(h('div', {},
    h('h3', {}, 'Export in another format or size'),
    h('div', { class: 'grid2' }, h('div', { class: 'field' }, h('label', { for: 'convFmt' }, 'Format'), fmtSel), h('div', { class: 'field' }, h('label', { for: 'convRes' }, 'Size'), resSel)),
    h('p', { class: 'muted small', style: 'margin-top:8px' }, `The lesson replays in real time (${fmtTime(take.duration)}) to build the new file. Keep this screen open.`),
    h('div', { class: 'row', style: 'margin-top:8px' }, btn('Render video', () => {

    }, { icon: 'film', disabled: !fmts.length }))));
 
  // gif
  const gw = h('select', { id: 'gifW' }, h('option', { value: '480' }, '480 px wide'), h('option', { value: '720', selected: true }, '720 px wide'), h('option', { value: '960' }, '960 px wide'));
  const gf = h('select', { id: 'gifF' }, h('option', { value: '8' }, '8 frames/s (smallest)'), h('option', { value: '12', selected: true }, '12 frames/s'), h('option', { value: '15' }, '15 frames/s (smoothest)'));
  body.append(h('div', {},
    h('h3', {}, 'Animated GIF (no sound)'),
    h('div', { class: 'grid2' }, h('div', { class: 'field' }, h('label', { for: 'gifW' }, 'Width'), gw), h('div', { class: 'field' }, h('label', { for: 'gifF' }, 'Smoothness'), gf)),
    take.duration > 120000 ? h('p', { class: 'muted small', style: 'margin-top:8px' }, 'Long recordings make very large GIFs. Use video for anything over two minutes.') : null,
    h('div', { class: 'row', style: 'margin-top:8px' }, btn('Make GIF', () => runJob('Building GIF…', (p, c) => renderGif(take, +gw.value, +gf.value, p, c), `${safeName(take.name)}.gif`), { icon: 'image' }))));
 
  // other

  const del = btn('Delete recording', null, { icon: 'trash', cls: 'danger' });
  armTwoTap(del, 'Tap again to delete', async () => { try { await DB.del('takes', take.id); } catch {} const i = sessionTakes.indexOf(take); if (i >= 0) sessionTakes.splice(i, 1); closeSheet(); toast('Recording deleted.'); });
  body.append(h('div', {},
    h('h3', {}, 'More'),
    h('div', { class: 'row' },
      take.audio ? btn(`Narration only (.${aext})`, () => deliver(take.audio, `${safeName(take.name)}-narration.${aext}`, reopen), { icon: 'mic' }) : null,
      btn('Final frame (.png)', () => runJob('Drawing final frame…', async () => renderLastFrame(take), `${safeName(take.name)}.png`), { icon: 'image' }),
      del)));
  body.append(status);
}

/* ---------- board save / export ---------- */
function boardFile() { app.board.cur = app.scene.pageId; return new Blob([JSON.stringify({ app: 'lesson-board', version: 1, board: app.board })], { type: 'application/json' }); }
async function renderPage(page, w, hh) {
  await preloadImages(page.items.filter(i => i.t === 'image').map(i => i.src));
  const sc = new Scene({ pages: [page], cur: page.id, name: '' });
  const cv = document.createElement('canvas'); cv.width = w; cv.height = hh; sc.render(cv.getContext('2d'), w, hh, 0);
  return cv;
}
let jsPdfPromise = null;
function loadJsPdf() {
  if (window.jspdf) return Promise.resolve(window.jspdf);
  if (!jsPdfPromise) jsPdfPromise = new Promise((res, rej) => {
    const s = h('script', { src: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js' });
    s.onload = () => res(window.jspdf); s.onerror = () => { jsPdfPromise = null; rej(new Error('jsPDF failed to load')); };
    document.head.append(s);
  });
  return jsPdfPromise;
}
$('#btnExport').addEventListener('click', () => {
  const body = openSheet('Save and export');
  const back = () => $('#btnExport').click();
  body.append(h('div', {}, h('h3', {}, 'Board file'),
    h('p', { class: 'muted small', style: 'margin-bottom:8px' }, 'Your board saves automatically in this browser. A board file is a backup you can keep in Files or open on another device.'),
    h('div', { class: 'row' },
      btn('Save board file (.json)', async () => { await saveNow(); deliver(boardFile(), `${safeName(app.board.name)}.board.json`, back); }, { icon: 'download', cls: 'primary' }),
      btn('Open board file…', () => $('#fileBoard').click(), { icon: 'folder' }))));
  body.append(h('div', {}, h('h3', {}, 'Pictures'),
    h('div', { class: 'row' },
      btn('This page (.png)', async () => { const cv = await renderPage(app.scene.page, 1920, 1080); cv.toBlob(b => deliver(b, `${safeName(app.board.name)}-p${app.scene.pageIndex + 1}.png`, back), 'image/png'); }, { icon: 'image' }),
      btn('All pages (.pdf)', async () => {
        toast('Building PDF…');
        try {
          const { jsPDF } = await loadJsPdf();
          const doc = new jsPDF({ orientation: 'landscape', unit: 'px', format: [1920, 1080], hotfixes: ['px_scaling'] });
          for (let i = 0; i < app.board.pages.length; i++) {
            if (i) doc.addPage([1920, 1080], 'landscape');
            const cv = await renderPage(app.board.pages[i], 1920, 1080);
            doc.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 1920, 1080);
          }
          deliver(doc.output('blob'), `${safeName(app.board.name)}.pdf`, back);
        } catch { toast('PDF export needs an internet connection the first time. Try again when online.'); }
      }, { icon: 'pages' }))));
});
$('#fileBoard').addEventListener('change', async (e) => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text()), b = data.board || data;
    if (!Array.isArray(b.pages) || !b.pages.length) throw new Error('bad');
    b.pages.forEach(p => { p.id = p.id || uid(); p.items = Array.isArray(p.items) ? p.items : []; p.bg = p.bg || { color: '#ffffff', pattern: 'none' }; });
    const existing = await DB.get('boards', b.id).catch(() => null);
    if (!b.id || existing) b.id = uid();
    b.name = b.name || 'Imported lesson'; b.updated = Date.now(); b.created = b.created || Date.now();
    if (app.rec) { toast('Stop recording before opening another board.'); return; }
    await saveNow(); closeSheet(); loadBoard(b); await saveNow(); toast(`Opened “${b.name}”.`);
  } catch { toast('That file is not a Lesson Board file.'); }
});

      try { const ok = await navigator.storage?.persist(); toast(ok ? 'Safari will keep this site’s data.' : 'Safari declined. Save important work to Files.'); } catch { toast('Not supported here.'); }
    }))));
  body.append(h('div', {}, h('h3', {}, 'Shortcuts with a keyboard'),

});
 
/* ---------- start ---------- */
function welcomeBoard() {
  const b = newBoard('Welcome to Lesson Board'), pg = b.pages[0];
  const T = (text, x, y, size, color) => { const m = measureText(text, size); return { id: uid(), t: 'text', x, y, text, color, size, w: m.w, h: m.h }; };
  const title = T('Lesson Board', 140, 120, 110, '#111827');
  const wave = []; for (let i = 0; i <= 60; i++) { const x = 140 + i * (title.w / 60); wave.push([Math.round(x), Math.round(262 + Math.sin(i / 4) * 6), 0.55 + 0.3 * Math.sin(i / 9)]); }
  pg.items.push(title, { id: uid(), t: 'stroke', tool: 'pen', color: '#e11d48', size: 8, pts: wave },
    T('1.  Pick a tool on the left and write with Apple Pencil.', 160, 360, 50, '#334155'),
    T('2.  Tap Record (bottom right) and talk through your board.', 160, 460, 50, '#334155'),
    T('3.  Tap Stop, then save as MP4, WebM, GIF or audio.', 160, 560, 50, '#334155'),
    T('Your board saves itself. Use Share to keep a board file.', 160, 700, 40, '#64748b'));
  const hl = measureText('Record', 50);
  pg.items.push({ id: uid(), t: 'stroke', tool: 'hl', color: '#eab308', size: 46, pts: [[160 + measureText('2.  Tap ', 50).w, 492, 0.5], [160 + measureText('2.  Tap ', 50).w + hl.w, 492, 0.5]] });
  pg.items.push({ id: uid(), t: 'arrow', color: '#2563eb', size: 8, x1: 1460, y1: 860, x2: 1760, y2: 1010 });
  return b;
}
async function init() {
  paintIcons();
  setColor(app.color); setTool('pen');
  let board = null;
  try {
    const last = LS.get('last', null);
    if (last) board = await DB.get('boards', last);
    if (!board) { const all = await DB.all('boards'); all.sort((a, b) => b.updated - a.updated); board = all[0] || null; }
  } catch { storageOK = false; }
  const first = !board;
  if (!board) board = welcomeBoard();
  loadBoard(board);
  if (first) await saveNow();
  if (!storageOK) setSaveState('Not saved — use Save board file', true);
  new ResizeObserver(layout).observe($('#stage'));
  window.addEventListener('resize', layout);
  updateRecUI();
  const banner = $('#banner');
  if (!canRecord()) { banner.textContent = 'Recording needs Safari on iPadOS 14.5 or later. Drawing and saving still work.'; banner.hidden = false; }
  else if (!window.isSecureContext) { banner.textContent = 'Open this page from an https:// address to record your voice. Silent recording still works.'; banner.hidden = false; }
  if (banner.hidden === false) setTimeout(() => banner.hidden = true, 9000);
}
